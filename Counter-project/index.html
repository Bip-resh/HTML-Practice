<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>counter-project</title>
  </head>
  <body>
    
    <div class=" flex flex-col  items-center w-2/5 bg-[#FBFCFD] m-auto mt-20 border border-[#E5E7EB] rounded-lg shadow-lg">

      <div 
      aria-label="Counter Heading"
      class="my-5 text-4xl font-sans font-semibold text-center text-[#141C2E]">
        Counter
      </div>

      <div 
      aria-label="counter value "
      class="text-7xl text-center font-bold h-auto w-8/10 flex justify-center items-center bg-[#F2F3F8] rounded-2xl p-2.5 ">
        <p 
        aria-label="counter value"
        id="num" class=" mb-2">0</p>
      </div>

      <div class=" w-full flex justify-between items-center px-10 py-10">

          <button 
          aria-label="Decrease Button"
          type="button"
          id="subtract"
            class="flex justify-center items-center  h-15 px-6 bg-[#D1D5DB] cursor-pointer text-4xl text-white rounded-2xl hover:bg-blue-300 active:scale-95 pointer-events-none">
          
            <span class="mb-2">-</span>
          
          </button>


          <button 
          aria-label="reset button"
          type="reset"
          id="reset"
            class="flex justify-center items-center h-15 px-6 bg-[#EF4444] cursor-pointer text-xl text-white rounded-2xl hover:bg-blue-300 active:scale-95  ">
          
            <span>Reset</span>
          
          </button>

          <button 
          aria-label="increase button"
          type="button"
          id="add"
            class="flex justify-between items-center  h-15 px-7 bg-[#3A80FB] cursor-pointer text-4xl text-white rounded-2xl hover:bg-blue-300 active:scale-95 ">
            <span class="mb-1">+</span>
          </button>


        
      </div>

    </div>


    <script type="module" src="/src/main.js"></script>
  </body>
</html>
