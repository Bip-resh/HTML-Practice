<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>header</title>
</head>
<body>
    
    <header class="w-full flex flex-col gap-5 mb-5  ">
    
        <div class="w-full px-4 sm:px-10 lg:px-25  flex justify-between items-center bg-[#D1EBF8]">
    
            <div>
                <p>Welcome to worldwide megamart</p>
            </div>
    
            <div class="flex justify-end items-center">
    
                <div class="flex gap-1 items-center px-4 my-2 border-r border-black/10 ">
                    <img src="../../src/assets/image/megamart/location.svg" class="h-4 w-4">
                    <p>
                        Deliver to <span class="font-medium">
                            423651
                        </span>
                    </p>
                </div>

                <div class="flex gap-1 items-center px-4 my-2 border-r border-black/10 ">
                    <img src="../../src/assets/image/megamart/truck.svg" class="h-4 w-4">
                    <p>
                        Track your order
                    </p>
                </div>

                <div class="flex gap-1 items-center pl-4 my-2 ">
                    <img src="../../src/assets/image/megamart/truck.svg" class="h-4 w-4">
                    <p>
                        Track your order
                    </p>
                </div>

            </div>

        </div>
        <div class="w-full flex  items-center px-4 sm:px-10 lg:px-25 mt-2 ">

            <div class=" w-3/10 shrink-0  flex items-center gap-3">

                <div class="inline-block py-2 px-2 bg-[#D1EBF8] rounded-lg shrink-0">
                    <img src="../../src/assets/image/megamart/menu.svg" class="h-6 w-6 object-cover ">
                </div>
            
                <div class="font-bold text-4xl text-[#008ECC] text-baseline">
                    MegaMart
                </div>
            </div>

            <div class=" flex-1 flex gap-6 items-center ">

                <div class=" flex-1 px-4 py-2 flex justify-between items-center bg-[#F3F9FB] cursor-pointer hover:scale-x-105 has-focus:outline-1 has-focus:outline-black shrink-0 rounded-lg  ">
                
                    <div class="flex-1 flex items-center">
                
                
                        <img src="../../src/assets/image/megamart/search.svg" class="h-6 w-6 object-contain shrink-0">
                
                
                        <input type="search" placeholder="Search essential , groceries and more " class="outline-none flex-1">
                
                    </div>
                
                    <div class="shrink-0">
                        <img src="../../src/assets/image/megamart/threeDotBar.svg" class="h-6 w-6 object-contain">
                    </div>
                
                
                </div>
                
                
                <div class="inline-flex items-center gap-3 ">
                
                    <div class="inline-flex gap-1 items-center">
                        <img src="../../src/assets/image/megamart/account.svg" class="h-6 w-6 object-cover">
                        <p class="text-sm sm:text-base text-black/70">Sign Up/Sign In</p>
                    </div>
                
                    <div class="h-6 w-px bg-black/10">
                
                    </div>
                
                    <div class="flex gap-1 items-center ">
                        <img src="../../src/assets/image/megamart/cart.svg" class="h-6 w-6 object-cover">
                
                        <p class="text-sm sm:text-base text-black/70">Cart</p>
                    </div>
                
                </div>
            </div>


        </div>
        
    </header>


</body>
</html>
