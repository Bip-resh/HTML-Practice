<body>
    <div>

                                   [&::-webkit-slider-thumb]:appearance-none

                                   [&::-webkit-slider-thumb]:w-5

                                   [&::-webkit-slider-thumb]:bg-black
                                   [&::-webkit-slider-thumb]:cursor-pointer

                                        [&::-webkit-slider-thumb]:appearance-none

                        <label for="green" class="block col-start-1 row-start-1 h-full w-full rounded-full cursor-pointer" ></label>

                    </div>

                            <img src="../../src/assets/image/correct.svg" class="h-4 w-4 ">

                    </div>

                    <div class="grid h-9.25 w-9.25 rounded-full ring-1 ring-black/20 bg-[#06CAF5]">

                        <input type="radio" id="violet" name="color-options" class="peer hidden">

                        <label for="violet" class="col-start-1 row-start-1 block h-full w-full cursor-pointer rounded-full"></label>

                    </div>


                    <div class="grid h-9.25 w-9.25 rounded-full ring-1 ring-black/20 bg-[#F506A4]">

                        <input type="radio" id="pink" name="color-options" class="peer hidden">

                    </div>


                    <div class="grid h-9.25 w-9.25 rounded-full ring-1 ring-black/20 bg-[#FFFFFF]">

                        <label for="3x-large" class="block h-full w-full px-5 py-2.5 rounded-full cursor-pointer">3X-Large</label>

                    <div

                        <div>
                            <img src="../../src/assets/image/down.svg" class="h-4 w-4 object-cover -rotate-90">

                    <div class="flex justify-between items-center opacity-60">

                        <div>
