<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css">
    <title>Cart</title>
</head>
<body>
    <div class="pt-5 px-10 flex flex-col gap-4 ">

        <p class="text-2xl">YOUR CART</p>

        <div class="cart-container flex flex-col gap-2 w-full h-120 border border-black/10 rounded-lg p-4 ">



                <template class="cart-template">

                    <div class="cart-card flex justify-between border border-black/10 p-3 rounded-2xl ">

                       <div class="flex flex-col justify-center items-center ">

                            <div class="pt-2">
                                <img src="/src/products_pics/shirt.png" alt="img" class="img-src h-20 w-20 object-cover">
                            </div>
                            <p class="title pb-2 text-lg font-semibold">
                                Shirt
                            </p>

                       </div>


                       <div class="flex flex-col justify-first items-center gap-4">
                            <div class="text-base font-medium">
                                Quantity
                            </div>

                            <div class="flex justify-between items-center gap-4 p-4 border border-black/10 rounded-2xl">
                                <button class="minus-btn">
                                    <img src="/src/products_pics/minus.svg" class="h-6 w-6 object-cover">
                                </button>

                                <p class="quantity-value font-bold text-base">0</p>

                                <button class="add-btn">
                                    <img src="./src/products_pics/plusIcon.svg" class="h-6 w-6 object-cover">
                                </button>
                            </div>
                       </div>


                       <div class="flex flex-col justify-start items-center gap-4">

                            <div class="text-base font-medium">
                                Price
                            </div>
                            
                            <div class="price text-sm font-bold border border-black/10 py-4 px-6 rounded-2xl">
                                00$
                            </div>
                       </div>



                       <div class=" delete flex justify-center items-center">
                            <img class="h-4 w-4 object-cover"
                             src="/src/cart_pic/delete.svg">
                       </div>
                    </div>


                </template>  


        </div>
    </div>


    <script type="module" src="/cart.js"></script>
</body>
</html>
