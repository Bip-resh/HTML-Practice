<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <header class="px-10 h-10 w-full bg-gray-200 flex justify-between items-center">


        <div class="flex items-center gap-20">

            <div class="h-10 w-10  ">
                <img src="src/header_pic/logo.svg" alt="logo" class="h-full  w-10">
            </div>
            
            <nav class="flex gap-3 items-center ">
                <button>Home</button>
                <button data-page="product">products</button>
                <button>collections</button>
                <button>About</button>

        </div>

        <div class="flex items-center gap-3 ">

            <div class="inline-grid">
            
                <button data-page="cart" class="notiBtn col-start-1 row-start-1 cursor-pointer hover:scale-105 active:scale-95">
                    <img src="src/header_pic/cart.svg" alt="account" class="h-6 w-6 rounded-full">

                <p class="notification hidden col-start-1 row-start-1 justify-self-center

            </div>
