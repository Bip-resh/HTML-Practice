<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="div-container">
        <div class="profile-container">
            <img src="./img/profile.png" alt="profile pic">
        </div>
        <div class="details-container">
            <h1>Alex johnson</h1>
            <p class="first-p">Ui/Ux designer</p>
            <p class="second-p"><img src="./img/location.svg" alt="location">San Francisco, CA</p>
            <p class="third-p">Passionate designer crafting beautiful and user-friendly digital experience</p>


            <div class="project-container">
                
                <div class="project">
                    <img src="./img/project.svg">
                    <div class="information">
                        <h2>32</h2>
                        <p>Projects</p>
                    </div>
                </div>

                <div class="project">
                    <img src="./img/follower.svg">
                    <div class="information">
                        <h2>1.2K</h2>
                        <p>Followers</p>
                    </div>
                </div>

                <div class="project">
                    <img src="./img/lheart.svg">
                    <div class="information">
                        <h2>98%</h2>
                        <p>Positive Feedback</p>
                    </div>
                </div>
            </div>

            <div class="button-container">
                <button class="message-button">
                    <p><img src="./img/message.svg">Message Me</p>
                </button>

                <button class="download-button">
                    <p><img src="./img/download.svg">Download CV</p>
                </button>
            </div>

            <div class="social-container">

                <a href="#">
                    <img src="./img/facebook.svg">
                </a>

                <a href="#">
                    <img src="./img/linkdin.svg">
                </a>

                <a href="#">
                    <img src="./img/instragram.svg">
                </a>

                <a href="#">
                    <img src="./img/github.svg">
                </a>
            </div>
        </div>
    </div>
</body>
</html>
